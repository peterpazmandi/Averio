name: Verify

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment:
    name: Deployment pipeline checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: node --test scripts/release/*.test.mjs
      - run: bash -n scripts/release/deploy-host.sh
      - name: Check workflow syntax and expressions
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -shellcheck=

  migration_bundle:
    name: Migration image and upgrade checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: averio_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d averio_migrations"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runnable migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.migrator
          platforms: linux/amd64
          load: true
          tags: averio-migrator:verify
      - name: Apply full migration chain and prove rerun is safe
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            docker run --rm --network host \
              -e 'AVERIO_MIGRATION_CONNECTION_STRING=Host=localhost;Port=5432;Database=averio_migrations;Username=postgres;Password=postgres' \
              averio-migrator:verify
          done
      - name: Verify ARM64 migration image builds
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.migrator
          platforms: linux/arm64
          push: false

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        # Use the official PostgreSQL image; the ECR mirror hit its public data limit.
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      AVERIO_TEST_CONNECTION_STRING: >-
        Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres
      ConnectionStrings__AverioDatabase: >-
        Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Restore backend
        run: dotnet restore Averio.slnx

      - name: Build backend
        run: dotnet build Averio.slnx --configuration Release --no-restore

      - name: Verify worker dependency graph
        run: dotnet run --project apps/Averio.Worker --configuration Release --no-build -- --verify-services

      - name: Run account regression suite
        run: >-
          dotnet run
          --project tests/Averio.Accounts.Tests/Averio.Accounts.Tests.csproj
          --configuration Release
          --no-build

      - name: Run transaction regression suite
        run: >-
          dotnet run
          --project tests/Averio.Transactions.Tests/Averio.Transactions.Tests.csproj
          --configuration Release
          --no-build

      - name: Run PostgreSQL persistence suite
        run: >-
          dotnet run
          --project tests/Averio.Persistence.Tests/Averio.Persistence.Tests.csproj
          --configuration Release
          --no-build

      - name: Verify invitation email browser layout
        run: |
          set -euo pipefail
          dotnet run \
            --project tests/Averio.Persistence.Tests/Averio.Persistence.Tests.csproj \
            --configuration Release --no-build \
            -- --invitation-previews "$RUNNER_TEMP/averio-email-previews"
          node tests/email/invitation-layout.mjs "$RUNNER_TEMP/averio-email-previews"

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/averio-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/averio-web
        run: npm ci

      - name: Run frontend regression tests
        working-directory: apps/averio-web
        run: node --test tests/*.test.mjs

      - name: Build frontend
        working-directory: apps/averio-web
        run: npm run build

      - name: Lint frontend
        working-directory: apps/averio-web
        run: npm run lint

  browser:
    name: Browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      AVERIO_TEST_CONNECTION_STRING: >-
        Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres
      ConnectionStrings__AverioDatabase: >-
        Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/averio-web/package-lock.json

      - name: Restore backend
        run: dotnet restore Averio.slnx

      - name: Build backend for collaboration flows
        run: dotnet build Averio.slnx --configuration Release --no-restore

      - name: Install frontend dependencies
        working-directory: apps/averio-web
        run: npm ci

      - name: Build frontend for collaboration flows
        working-directory: apps/averio-web
        run: npm run build

      - name: Verify information popover browser flows
        timeout-minutes: 5
        working-directory: apps/averio-web
        run: |
          node tests/runtime-config.browser.mjs
          node tests/info-popover.browser.mjs
          node tests/helper-pages.browser.mjs

      - name: Verify XLSX import browser flows
        timeout-minutes: 10
        working-directory: apps/averio-web
        run: |
          node tests/imports.browser.mjs
          node tests/import-history.browser.mjs
          node tests/imported-transactions.browser.mjs
          node tests/import-tools.browser.mjs

      - name: Verify receipt browser flows
        timeout-minutes: 3
        working-directory: apps/averio-web
        run: node tests/receipts.browser.mjs

      - name: Verify Personal Money browser flows
        timeout-minutes: 15
        working-directory: apps/averio-web
        run: |
          node tests/personal-money.browser.mjs
          node tests/recurring-allowance.browser.mjs
          node tests/transaction-editor.browser.mjs
          node tests/household-navigation.browser.mjs
          node tests/landing-review.browser.mjs

      - name: Upload receipt review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: receipt-review-screenshots
          path: test-results/receipts
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload responsive navigation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: household-navigation-screenshots
          path: test-results/household-navigation
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify collaboration in separate browser sessions
        timeout-minutes: 20
        working-directory: apps/averio-web
        run: npm run test:collaboration

      - name: Upload collaboration failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: collaboration-failure-evidence
          path: test-results/collaboration
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload landing and contact screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landing-contact-screenshots
          path: test-results/landing-review
          if-no-files-found: ignore
          retention-days: 7

  generated_client:
    name: Generated OpenAPI client
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ConnectionStrings__AverioDatabase: >-
        Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://localhost:5180

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/averio-web/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore backend
        run: dotnet restore Averio.slnx

      - name: Build backend
        run: dotnet build Averio.slnx --configuration Release --no-restore

      - name: Install frontend dependencies
        working-directory: apps/averio-web
        run: npm ci

      - name: Verify generated OpenAPI client
        working-directory: apps/averio-web
        run: |
          set -euo pipefail

          dotnet run \
            --project ../../apps/Averio.Api/Averio.Api.csproj \
            --configuration Release \
            --no-build \
            --no-launch-profile \
            >/tmp/averio-api.log 2>&1 &
          api_pid=$!

          cleanup() {
            kill "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent \
              http://localhost:5180/openapi/v1.json \
              >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            tail -100 /tmp/averio-api.log
            exit 1
          fi

          node tests/receipt-openapi.mjs
          npm run api:generate

          if [ -n "$(git status --porcelain -- src/shared/api/generated)" ]; then
            git diff -- src/shared/api/generated
            git status --short -- src/shared/api/generated
            echo "Generated API client is out of date."
            exit 1
          fi

