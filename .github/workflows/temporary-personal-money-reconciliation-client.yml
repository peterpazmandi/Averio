name: Temporary regenerate Personal Money PR2 OpenAPI client
on:
  push:
    branches: [feat/personal-money-shared-reconciliation]
    paths:
      - .github/workflows/temporary-personal-money-reconciliation-client.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    if: github.repository == 'peterpazmandi/Averio'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/personal-money-shared-reconciliation
          persist-credentials: true
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: 10.0.x}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/averio-web/package-lock.json
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - run: dotnet restore Averio.slnx
      - run: dotnet build Averio.slnx --configuration Release --no-restore
      - run: npm ci
        working-directory: apps/averio-web
      - name: Generate API from running Averio
        working-directory: apps/averio-web
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5180
          ConnectionStrings__AverioDatabase: Host=localhost;Database=unused;Username=unused;Password=unused
        run: |
          set -euo pipefail
          dotnet run --project ../../apps/Averio.Api/Averio.Api.csproj --configuration Release --no-build --no-launch-profile >/tmp/api.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:5180/openapi/v1.json >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:5180/openapi/v1.json >/dev/null || { tail -80 /tmp/api.log; exit 1; }
          npm run api:generate
      - name: Commit generated client
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/averio-web/src/shared/api/generated
          if ! git diff --cached --quiet; then
            git commit -m "build(api): regenerate shared Personal Money API client"
            git push origin HEAD:feat/personal-money-shared-reconciliation
          fi
