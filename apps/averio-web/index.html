<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="description" content="Averio helps individuals and households manage shared accounts, personal money, transactions and everyday finances in one place." />
	<meta name="theme-color" content="#f7faf8" />
	<title>Averio — Your money. Together, on your terms.</title>
	<script>
		(() => {
			try {
				const stored = localStorage.getItem('averio.theme');

				const dark =
					stored
						? stored === 'dark'
						: window.matchMedia(
							'(prefers-color-scheme: dark)'
						).matches;

				document.documentElement.classList.toggle(
					'dark',
					dark
				);

				document.documentElement.style.colorScheme =
					dark ? 'dark' : 'light';
			} catch {
				// Ignore unavailable storage.
			}
		})();
	</script>
</head>

<body>
	<div id="root"></div>
	<script src="/runtime-config.js"></script>
	<script type="module" src="/src/main.tsx"></script>
</body>

</html>
